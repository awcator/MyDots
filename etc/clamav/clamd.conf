##
## ClamAV Daemon Configuration - Sensitive Workstation (Hardened)
## Generated: 2026-07-14
##

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
LogFile /home/awcator/Documents/log/clamav/log
LogTime yes
LogRotate yes
ExtendedDetectionInfo yes

# ─────────────────────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────────────────────
PidFile /run/clamav/clamd.pid
TemporaryDirectory /var/tmp/clamav-tmp
User awcator

# ─────────────────────────────────────────────────────────────────────────────
# Socket / Network
# ─────────────────────────────────────────────────────────────────────────────
LocalSocket /run/clamav/clamd.ctl
FixStaleSocket yes
TCPSocket 3310
TCPAddr localhost

# ─────────────────────────────────────────────────────────────────────────────
# Performance
# ─────────────────────────────────────────────────────────────────────────────
MaxThreads 12
MaxQueue 200
MaxConnectionQueueLength 200
ReadTimeout 300
CommandReadTimeout 30
IdleTimeout 60
StreamMaxLength 100M
StreamMinPort 30000
StreamMaxPort 32000
ConcurrentDatabaseReload yes

# ─────────────────────────────────────────────────────────────────────────────
# Scan Paths
# ─────────────────────────────────────────────────────────────────────────────
MaxDirectoryRecursion 25
FollowDirectorySymlinks yes
FollowFileSymlinks yes
CrossFilesystems yes

# Exclude only ClamAV's own directories to avoid scan loops
ExcludePath ^/proc/
ExcludePath ^/sys/
ExcludePath /var/tmp/clamav-tmp/
ExcludePath /home/awcator/Documents/log/clamav/

# ─────────────────────────────────────────────────────────────────────────────
# Virus Event
# ─────────────────────────────────────────────────────────────────────────────
VirusEvent /opt/send_virus_alert_sms.sh

# ─────────────────────────────────────────────────────────────────────────────
# Detection - ALL ENABLED for sensitive workstation
# ─────────────────────────────────────────────────────────────────────────────

# Potentially Unwanted Applications
DetectPUA yes
ExcludePUA NetTool
ExcludePUA PWTool

# Heuristics
HeuristicAlerts yes
HeuristicScanPrecedence yes

# Heuristic Alerts
AlertBrokenExecutables no
AlertBrokenMedia no
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertOLE2Macros yes
AlertPhishingSSLMismatch yes
AlertPhishingCloak yes
AlertPartitionIntersection yes
AlertExceedsMax yes

# ─────────────────────────────────────────────────────────────────────────────
# Scan Engines - ALL ENABLED
# ─────────────────────────────────────────────────────────────────────────────

# Executables
ScanPE yes
ScanELF yes

# Documents
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanOneNote yes

# Images
ScanImage yes
ScanImageFuzzyHash yes

# Mail
ScanMail yes
ScanPartialMessages no
PhishingSignatures yes
PhishingScanURLs yes

# HTML
ScanHTML yes

# Archives
ScanArchive yes

# ─────────────────────────────────────────────────────────────────────────────
# Scan Limits (generous for thorough scanning)
# ─────────────────────────────────────────────────────────────────────────────
MaxScanSize 1000M
MaxFileSize 400M
MaxRecursion 25
MaxFiles 20000
MaxEmbeddedPE 100M
MaxHTMLNormalize 40M
MaxHTMLNoTags 8M
MaxScriptNormalize 20M
MaxZipTypeRcg 10M
MaxPartitions 128
MaxIconsPE 200
MaxRecHWP3 16
PCREMatchLimit 100000
PCRERecMatchLimit 5000
PCREMaxFileSize 400M
MaxScanTime 300000

# ─────────────────────────────────────────────────────────────────────────────
# Bytecode (critical for new virus detection)
# ─────────────────────────────────────────────────────────────────────────────
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 10000

# ─────────────────────────────────────────────────────────────────────────────
# On-Access Real-Time Scanning
# ─────────────────────────────────────────────────────────────────────────────
OnAccessMaxFileSize 50M
OnAccessMaxThreads 8
OnAccessCurlTimeout 10000
OnAccessPrevention yes
OnAccessExtraScanning yes
OnAccessRetryAttempts 3

# Include paths (monitored in real-time)
OnAccessIncludePath /home/awcator
OnAccessMountPath /tmp

# Exclude paths (prevent loops and performance issues)
OnAccessExcludePath /home/awcator/.cache/
OnAccessExcludePath /home/awcator/.local/share/Trash/
OnAccessExcludePath /var/tmp/clamav-tmp/
OnAccessExcludePath /home/awcator/Documents/log/clamav/
OnAccessExcludePath /home/awcator/Documents/infected/
OnAccessExcludePath /home/awcator/.config/BraveSoftware/
OnAccessExcludePath /home/awcator/.mozilla/

# Exclude ClamAV's own user to prevent loops
OnAccessExcludeRootUID yes
OnAccessExcludeUname clamav
